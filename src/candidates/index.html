<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>候选池 · 豆瓣随机</title>
    <link rel="stylesheet" href="../sidepanel/sidepanel.css" />
    <link rel="stylesheet" href="./candidates.css" />
  </head>
  <body class="page">
    <header class="page-head">
      <h1>候选池</h1>
      <button id="help" class="icon-btn" type="button" aria-label="这个页面是什么">?</button>
      <span id="meta" class="page-hint"></span>
      <button id="toggle-hidden" class="link page-tool" type="button">已屏蔽</button>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="类别">
      <button class="tab" type="button" role="tab" data-cat="movie">
        电影<span class="tab-count"></span>
      </button>
      <button class="tab" type="button" role="tab" data-cat="tv">
        剧集<span class="tab-count"></span>
      </button>
      <button class="tab" type="button" role="tab" data-cat="book">
        图书<span class="tab-count"></span>
      </button>
    </nav>

    <section id="list-view">
      <div class="filters">
        <label class="field">
          <span>来源</span>
          <select id="filter-source">
            <option value="">全部</option>
            <option value="mark">想看 / 想读</option>
            <option value="done">看过 / 读过</option>
          </select>
        </label>
        <label class="field">
          <span>标记时间</span>
          <select id="filter-time">
            <option value="">全部</option>
            <option value="7">最近一周</option>
            <option value="30">最近一月</option>
            <option value="365">最近一年</option>
          </select>
        </label>
        <label class="check">
          <input type="checkbox" id="filter-comment" />
          有我的评论
        </label>
      </div>

      <div class="bulk-bar">
        <label class="check">
          <input type="checkbox" id="select-all" />
          全选
        </label>
        <span id="selection-count" class="page-hint"></span>
        <span class="bulk-spacer"></span>
        <button id="hide-selected" class="mini" type="button" disabled>屏蔽选中</button>
        <button id="hide-filtered" class="mini" type="button">屏蔽全部筛选结果</button>
      </div>

      <main id="list" class="cand-list"></main>
      <p id="empty" class="empty-line" hidden></p>
    </section>

    <section id="hidden-view" hidden>
      <p class="page-hint hidden-hint">
        被屏蔽的条目不会再被抽到。恢复之后，它们会重新进入候选池。
      </p>
      <main id="hidden-list" class="cand-list"></main>
      <p id="hidden-empty" class="empty-line" hidden>还没有屏蔽任何条目。</p>
    </section>

    <div id="confirm-panel" class="overlay" hidden>
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">确认</h2>
        <p id="confirm-text"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="ghost" type="button">再想想</button>
          <button id="confirm-ok" class="primary" type="button">确定</button>
        </div>
      </div>
    </div>

    <div id="help-panel" class="overlay" hidden>
      <div class="help-card" role="dialog" aria-label="这个页面是什么">
        <header class="help-head">
          <h2>这个页面是什么</h2>
          <button id="help-close" class="icon-btn close" type="button" aria-label="关闭"></button>
        </header>

        <p>这里是你从豆瓣同步下来的全部候选。</p>
        <p>抽到不想抽的，屏蔽掉它，以后就不会再出现。</p>
        <p>屏蔽只记在这台电脑上，豆瓣上的收藏不受影响。</p>
      </div>
    </div>

    <script type="module" src="./candidates.js"></script>
  </body>
</html>
