<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>候选池 · 豆瓣随机</title>
    <link rel="stylesheet" href="../sidepanel/sidepanel.css" />
    <link rel="stylesheet" href="./candidates.css" />
  </head>
  <body class="page">
    <header class="page-head">
      <h1>候选池</h1>
      <button id="help" class="icon-btn" type="button" aria-label="这个页面是什么">?</button>
      <span id="meta" class="page-hint"></span>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="类别">
      <button class="tab" type="button" role="tab" data-cat="movie">
        电影<span class="tab-count"></span>
      </button>
      <button class="tab" type="button" role="tab" data-cat="tv">
        剧集<span class="tab-count"></span>
      </button>
      <button class="tab" type="button" role="tab" data-cat="book">
        图书<span class="tab-count"></span>
      </button>
    </nav>

    <section id="list-view">
      <div class="filters">
        <label class="field">
          <span>来源</span>
          <select id="filter-source">
            <option value="all">全部来源</option>
            <option value="mark">想看 / 想读</option>
            <option value="done">看过 / 读过</option>
          </select>
        </label>
        <label class="field">
          <span>标记时间</span>
          <select id="filter-time">
            <option value="">全部</option>
            <option value="7">最近一周</option>
            <option value="30">最近一月</option>
            <option value="365">最近一年</option>
          </select>
        </label>
        <label class="field">
          <span>状态</span>
          <select id="filter-status">
            <option value="">全部</option>
            <option value="in">候选池中</option>
            <option value="out">候选池外</option>
          </select>
        </label>
        <label class="field">
          <span>评论</span>
          <select id="filter-comment">
            <option value="">全部</option>
            <option value="yes">有我的评论</option>
          </select>
        </label>
      </div>
      <p id="scope-hint" class="page-hint scope-hint" hidden></p>

      <div id="sync-status" class="sync-status" role="status" hidden>
        <span id="sync-status-text">正在同步</span>
        <span class="sync-line" aria-hidden="true"><i></i></span>
      </div>

      <div class="bulk-bar">
        <button id="select-all" class="mini" type="button">全选</button>
        <button id="invert-pool" class="mini" type="button">反选</button>
        <span id="pool-count" class="page-hint"></span>
        <span class="bulk-spacer"></span>
        <button id="save-pool" class="save-pool" type="button" disabled>保存</button>
      </div>

      <main id="list" class="cand-list"></main>
      <p id="empty" class="empty-line" hidden></p>
    </section>

    <div id="load-panel" class="overlay" hidden>
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="load-title">
        <h2 id="load-title">加载这个来源？</h2>
        <p>这一半还没有加载。要从豆瓣拉取一次，可能需要等一会儿；加载后这些条目会进入候选池。</p>
        <div class="confirm-actions">
          <button id="load-cancel" class="ghost" type="button">取消</button>
          <button id="load-ok" class="primary" type="button">加载</button>
        </div>
      </div>
    </div>

    <div id="help-panel" class="overlay" hidden>
      <div class="help-card" role="dialog" aria-label="这个页面是什么">
        <header class="help-head">
          <h2>这个页面是什么</h2>
          <button id="help-close" class="icon-btn close" type="button" aria-label="关闭"></button>
        </header>

        <p>这里是你从豆瓣同步下来的候选。</p>
        <p>
          来源可以按需加载：第一次勾上另一半时会从豆瓣拉一次，加载后这些条目就进入候选池。
        </p>
        <p>来源只决定这里看哪些；候选集由每行的勾选决定。勾选表示会参与抽取，取消勾选、点保存，它就不会再出现。</p>
        <p>这些勾选只记在这台电脑上，豆瓣上的收藏不受影响。</p>
      </div>
    </div>

    <script type="module" src="./candidates.js"></script>
  </body>
</html>
